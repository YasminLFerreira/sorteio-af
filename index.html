<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aliança Francesa Rio · Cadastro e sorteio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--azul:#12307f;--azul2:#2f55b8;--vermelho:#d6282f;--gelo:#e8edf7;--tinta:#101a3a;--branco:#fff}
*{box-sizing:border-box}
body{margin:0;font:400 17px/1.5 'Bricolage Grotesque',system-ui,sans-serif;color:var(--tinta);background:linear-gradient(90deg,var(--azul) 0 33.4%,var(--branco) 33.4% 66.7%,var(--vermelho) 66.7%) top/100% 10px no-repeat,var(--gelo);min-height:100vh}
main{max-width:720px;margin:0 auto;padding:36px 18px 60px}
main.largo{max-width:980px}
.card{background:var(--branco);border-radius:6px;padding:28px 24px;box-shadow:0 1px 0 #c9d2e8}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1;font-weight:800;margin:0 0 8px;color:var(--azul)}
h2{font-size:22px;margin:0 0 12px;color:var(--azul)}
.marca{font-weight:600;color:var(--vermelho);margin:0 0 14px}
label{display:block;font-weight:600;margin:16px 0 0}
input[type=text],input[type=email],input[type=password],select{width:100%;font:inherit;padding:12px;border:2px solid #b9c4e0;border-radius:4px;margin-top:6px;background:#fff}
fieldset{border:0;padding:0;margin:20px 0 0}legend{font-weight:600;padding:0}
.opt{display:flex;gap:10px;align-items:center;font-weight:400;margin:8px 0 0}
.opt input{width:22px;height:22px;accent-color:var(--azul)}
.btn{font-family:inherit;font-weight:600;font-size:17px;background:var(--azul);color:#fff;border:0;border-radius:4px;padding:14px 22px;cursor:pointer;margin-top:22px}
.btn.sec{background:var(--gelo);color:var(--azul)}.btn.red{background:var(--vermelho)}
.btn:disabled{opacity:.5;cursor:default}
:is(a,button,input,select):focus-visible{outline:3px solid var(--vermelho);outline-offset:2px}
#msg{min-height:1.5em;margin:12px 0 0;font-weight:600;color:var(--vermelho)}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:18px}.barra>*{flex:1 1 200px}.barra .btn{margin:0;flex:0 0 auto}
.abas{display:flex;gap:6px;margin:0 0 14px}.abas .btn{margin:0;padding:10px 18px}.abas .on{background:var(--azul);color:#fff}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--gelo)}th{color:var(--azul)}
.rolo{overflow-x:auto}
.roleta{position:relative;width:min(100%,560px);margin:10px auto}
.roleta canvas{width:100%;height:auto;display:block}
.seta{position:absolute;left:50%;top:-6px;transform:translateX(-50%);border:14px solid transparent;border-top:28px solid var(--vermelho);border-bottom:0;filter:drop-shadow(0 2px 0 #fff)}
dialog{border:0;border-radius:6px;padding:32px;max-width:440px;text-align:center}
dialog::backdrop{background:rgba(16,26,58,.7)}
dialog .nome{font-size:clamp(30px,8vw,46px);font-weight:800;color:var(--azul);line-height:1.1;margin:6px 0}
.qr svg{width:min(100%,320px);height:auto;display:block;margin:10px auto}
.centro{text-align:center}
.ganh li{margin:4px 0}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// ===== CONFIGURAÇÃO: cole aqui a URL /exec do Apps Script =====
const API = 'https://script.google.com/macros/s/AKfycbxvrNkpyINCOfrsTIVRvdqtCtIv3S_CU9UoHtzFs9dvA3QQKrxIvc9RbwKqB-5YCdOGWg/exec';
// ==============================================================

const S = { chave: sessionStorage.chave || '', eventos: [], slug: '', rows: [], aba: 'part', verEmail: false };
const COL = ['#12307f', '#2f55b8', '#d6282f', '#0b1d52'];
let rot = 0, spinning = false, pool = [];

const $ = s => document.querySelector(s), app = $('#app'), q = new URLSearchParams(location.search);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(d) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(d) });
  return r.json();
}

if (q.get('evento')) form(q.get('evento'));
else if (q.has('admin')) admin();
else app.innerHTML = '<section class="card"><h1>Aliança Francesa Rio</h1><p>Escaneie o QR Code do evento para se cadastrar.</p></section>';

/* ---------- Formulário do participante ---------- */
async function form(slug) {
  let nomeEvento = (q.get('n') || '').trim();
  if (!nomeEvento) {
    app.innerHTML = '<section class="card"><p>Carregando…</p></section>';
    let info; try { info = await api({ acao: 'info', slug }); } catch { info = null; }
    if (!info || !info.ok) { app.innerHTML = '<section class="card"><h1>Evento não encontrado</h1><p>Confira o QR Code ou fale com a equipe.</p></section>'; return; }
    if (info.encerrado) { app.innerHTML = '<section class="card"><h1>Inscrições encerradas</h1><p>Este evento já foi encerrado e não aceita mais cadastros.</p></section>'; return; }
    nomeEvento = info.nome;
  } else {
    // Validação rápida de status caso venha direto por parâmetro
    let info; try { info = await api({ acao: 'info', slug }); } catch {}
    if (info && info.encerrado) { app.innerHTML = '<section class="card"><h1>Inscrições encerradas</h1><p>Este evento já foi encerrado e não aceita mais cadastros.</p></section>'; return; }
  }

  app.innerHTML = `<section class="card"><p class="marca">Aliança Francesa Rio</p><h1>${esc(nomeEvento)}</h1>
  <p>Cadastre-se para concorrer ao sorteio de ingressos.</p>
  <form id="f">
    <label>Nome completo<input type="text" name="nome" required autocomplete="name"></label>
    <label>E-mail<input type="email" name="email" required autocomplete="email" placeholder="seu@email.com"></label>
    
    <fieldset><legend>Você é aluno(a) da Aliança Francesa?</legend>
      <label class="opt"><input type="radio" name="aluno" value="sim" required> Sim</label>
      <label class="opt"><input type="radio" name="aluno" value="não"> Não</label></fieldset>
    
    <fieldset id="fi" hidden><legend>Tem interesse em aprender francês?</legend>
      <label class="opt"><input type="radio" name="interesse" value="sim"> Sim</label>
      <label class="opt"><input type="radio" name="interesse" value="não"> Não</label></fieldset>

    <fieldset><legend>Aceita receber a newsletter e novidades da Aliança Francesa por e-mail?</legend>
      <label class="opt"><input type="radio" name="newsletter" value="sim" required> Sim</label>
      <label class="opt"><input type="radio" name="newsletter" value="não"> Não</label></fieldset>

    <label>Como ficou sabendo do evento?
      <select name="como_soube" required>
        <option value="">Selecione...</option>
        <option value="Instagram">Instagram</option>
        <option value="WhatsApp">WhatsApp</option>
        <option value="TikTok">TikTok</option>
        <option value="Amigos / Conhecidos">Amigos / Conhecidos</option>
        <option value="E-mail da AF">E-mail da AF</option>
        <option value="Outros">Outros</option>
      </select>
    </label>

    <label class="opt" style="margin-top:22px"><input type="checkbox" required> <span>Autorizo o uso dos meus dados para o sorteio e para contato da Aliança Francesa.</span></label>
    <button class="btn" id="go">Cadastrar</button><p id="msg" role="status"></p>
  </form></section>`;

  const f = $('#f');
  f.addEventListener('change', () => {
    const nao = f.aluno.value === 'não';
    $('#fi').hidden = !nao;
    f.querySelectorAll('[name=interesse]').forEach(i => i.required = nao);
  });
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const b = $('#go'), m = $('#msg'); b.disabled = true; m.textContent = '';
    const d = { 
      acao: 'cadastrar', 
      slug, 
      nome: f.nome.value, 
      email: f.email.value, 
      aluno: f.aluno.value, 
      interesse: f.aluno.value === 'não' ? f.interesse.value : '', 
      newsletter: f.newsletter.value, 
      como_soube: f.como_soube.value 
    };
    const fatal = { dados: 'Confira os dados preenchidos.', evento: 'Evento não encontrado ou encerrado.' };
    for (let t = 0; t < 4; t++) {
      if (t) { m.textContent = 'Conexão instável, tentando de novo…'; await new Promise(ok => setTimeout(ok, 1500 * t + Math.random() * 1500)); }
      try {
        const r = await api(d);
        if (r.ok || (r.erro === 'duplicado' && t)) {
          app.innerHTML = `<section class="card"><p class="marca">Aliança Francesa Rio</p><h1>Cadastro feito!</h1><p>Boa sorte, ${esc(d.nome.split(' ')[0])}. O sorteio será feito pela equipe durante o evento.</p></section>`; return;
        }
        if (r.erro === 'duplicado') { m.textContent = 'Este e-mail já está cadastrado neste evento.'; break; }
        if (fatal[r.erro]) { m.textContent = fatal[r.erro]; break; }
      } catch {}
    }
    if (!m.textContent || m.textContent.startsWith('Conexão')) m.textContent = 'Não foi possível cadastrar. Verifique a internet e tente de novo.';
    b.disabled = false;
  });
}

/* ---------- Painel da equipe ---------- */
function admin() { app.className = 'largo'; S.chave ? carregarEventos() : login(); }

function login(erro) {
  app.innerHTML = `<section class="card" style="max-width:420px"><h1>Painel da equipe</h1>
  <form id="l"><label>Senha<input type="password" id="pw" required autocomplete="current-password" autofocus></label>
  <button class="btn" type="submit">Entrar</button><p id="msg" role="alert">${erro ? 'Senha incorreta.' : ''}</p></form></section>`;
  $('#pw').focus();
  $('#l').onsubmit = e => { e.preventDefault(); S.chave = $('#pw').value; carregarEventos(); };
}

async function carregarEventos(manter) {
  let r; try { r = await api({ acao: 'eventos', chave: S.chave }); } catch { return app.innerHTML = '<section class="card"><p>Sem conexão com a planilha. Confira a URL no arquivo.</p></section>'; }
  if (!r.ok) { sessionStorage.removeItem('chave'); S.chave = ''; return login(true); }
  sessionStorage.chave = S.chave; S.eventos = r.eventos.reverse();
  if (!manter && !S.slug && S.eventos.length) S.slug = S.eventos[0].slug;
  S.slug ? carregarPart() : painel();
}

async function carregarPart() {
  const r = await api({ acao: 'participantes', chave: S.chave, slug: S.slug });
  S.rows = r.ok ? r.rows : []; painel();
}

function painel() {
  const optionsHtml = S.eventos.length 
    ? S.eventos.map(e => `<option value="${esc(e.slug)}" ${e.slug === S.slug ? 'selected' : ''}>${esc(e.nome)} ${e.encerrado ? '(Encerrado)' : ''}</option>`).join('') 
    : '<option value="">Nenhum evento ainda</option>';

  const evAtual = S.eventos.find(e => e.slug === S.slug);
  const textoEncerrar = evAtual && evAtual.encerrado ? 'Reabrir inscrições' : 'Encerrar evento';

  app.innerHTML = `<h1>Painel da equipe</h1>
  <div class="barra"><label style="margin:0">Evento<select id="ev">${optionsHtml}</select></label>
  <button class="btn sec" id="novo">Criar evento</button>
  ${S.slug ? `<button class="btn sec" id="toggle-encerrar" style="background:#ffe8e8;color:#d6282f">${textoEncerrar}</button>` : ''}</div>
  ${S.slug ? `<div class="abas"><button class="btn ${S.aba === 'part' ? 'on' : 'sec'}" data-a="part">Participantes</button><button class="btn ${S.aba === 'qr' ? 'on' : 'sec'}" data-a="qr">QR Code</button><button class="btn ${S.aba === 'rol' ? 'on' : 'sec'}" data-a="rol">Roleta</button></div><section class="card" id="vista"></section>` : '<section class="card"><p>Crie o primeiro evento para gerar o QR Code.</p></section>'}`;
  
  $('#ev').onchange = e => { S.slug = e.target.value; rot = 0; carregarPart(); };
  $('#novo').onclick = criar;
  if ($('#toggle-encerrar')) {
    $('#toggle-encerrar').onclick = async () => {
      const acaoStr = evAtual && evAtual.encerrado ? 'reabrir' : 'encerrar';
      if (!confirm(`Deseja realmente ${acaoStr} este evento?`)) return;
      const r = await api({ acao: 'toggle_encerrar', chave: S.chave, slug: S.slug });
      if (r.ok) carregarEventos(true);
      else alert('Não foi possível alterar o status do evento.');
    };
  }
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { S.aba = b.dataset.a; painel(); });
  if (S.slug) ({ part: vPart, qr: vQR, rol: vRol })[S.aba]();
}

async function criar() {
  const nome = (prompt('Nome do evento (aparece no formulário):') || '').trim(); if (!nome) return;
  const slug = nome.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50);
  const r = await api({ acao: 'criar', chave: S.chave, slug, nome });
  if (!r.ok) return alert(r.erro === 'existe' ? 'Já existe um evento com esse nome. Use outro nome.' : 'Não foi possível criar o evento.');
  S.slug = slug; S.aba = 'qr'; carregarEventos(true);
}

function vPart() {
  const n = S.rows.length, al = S.rows.filter(r => r.aluno === 'sim').length;
  $('#vista').innerHTML = `<h2>${n} cadastro${n === 1 ? '' : 's'} (${al} aluno${al === 1 ? '' : 's'})</h2>
  <button class="btn sec" id="vt" style="margin:0 0 12px">${S.verEmail ? 'Ocultar e-mails' : 'Mostrar e-mails'}</button>
  <div class="rolo"><table><thead><tr><th>Data/Hora</th><th>Nome</th><th>E-mail</th><th>Aluno?</th><th>Interesse em francês?</th><th>Aceita Newsletter?</th><th>Como soube?</th><th>Ganhou?</th></tr></thead><tbody>
  ${S.rows.map(r => `<tr><td>${esc(r.data)}</td><td>${esc(r.nome)}</td><td>${S.verEmail ? esc(r.email) : mascaraEmail(r.email)}</td><td>${esc(r.aluno)}</td><td>${esc(r.interesse)}</td><td>${esc(r.newsletter)}</td><td>${esc(r.comoSoube)}</td><td>${esc(r.ganhou)}</td></tr>`).join('') || '<tr><td colspan="8">Ninguém se cadastrou ainda.</td></tr>'}
  </tbody></table></div><button class="btn sec" id="at">Atualizar lista</button>`;
  $('#at').onclick = carregarPart;
  $('#vt').onclick = () => { S.verEmail = !S.verEmail; vPart(); };
}
function mascaraEmail(e) {
  const str = String(e || '');
  const partes = str.split('@');
  if (partes.length !== 2) return '•••••@••••';
  const usuario = partes[0];
  const dominio = partes[1];
  const visivel = usuario.slice(0, 2);
  return visivel + '••••@' + dominio;
}

function vQR() {
  const ev = S.eventos.find(e => e.slug === S.slug);
  const link = location.origin + location.pathname + '?evento=' + S.slug + (ev ? '&n=' + encodeURIComponent(ev.nome) : '');
  const qr = qrcode(0, 'M'); qr.addData(link); qr.make(); const svg = qr.createSvgTag(8, 2);
  $('#vista').innerHTML = `<div class="centro"><h2>QR Code do evento</h2><div class="qr">${svg}</div>
  <button class="btn" id="bx">Baixar QR (SVG)</button> <button class="btn sec" id="cp">Copiar link</button></div>`;
  $('#bx').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' })); a.download = 'qr-' + S.slug + '.svg'; a.click(); };
  $('#cp').onclick = () => navigator.clipboard.writeText(link).then(() => $('#cp').textContent = 'Link copiado');
}

function vRol() {
  $('#vista').innerHTML = `<div class="barra"><label style="margin:0">Quem participa deste sorteio<select id="flt">
  <option value="todos">Todos os cadastrados</option><option value="alunos">Só alunos</option><option value="nao">Só quem não é aluno</option><option value="int">Não alunos com interesse em francês</option></select></label>
  <button class="btn red" id="gira">Girar a roleta</button></div><p id="cnt" role="status"></p>
  <div class="roleta"><div class="seta"></div><canvas id="w" width="900" height="900" aria-label="Roleta do sorteio"></canvas></div>
  <h2>Ganhadores</h2><ul class="ganh">${S.rows.filter(r => r.ganhou).map(r => `<li>${esc(r.nome)}</li>`).join('') || '<li>Nenhum ainda.</li>'}</ul>
  <dialog id="dlg"></dialog>`;
  $('#flt').onchange = filtrar; $('#gira').onclick = girar; filtrar();
}

function filtrar() {
  const f = $('#flt').value;
  pool = S.rows.filter(r => !r.ganhou && (f === 'todos' || (f === 'alunos' && r.aluno === 'sim') || (f === 'nao' && r.aluno !== 'sim') || (f === 'int' && r.aluno !== 'sim' && r.interesse === 'sim')));
  $('#cnt').textContent = pool.length + (pool.length === 1 ? ' pessoa na roleta' : ' pessoas na roleta');
  $('#gira').disabled = !pool.length; desenhar();
}

function desenhar() {
  const c = $('#w'), x = c.getContext('2d'), W = c.width, R = W / 2 - 10, n = pool.length;
  x.clearRect(0, 0, W, W); x.save(); x.translate(W / 2, W / 2);
  if (!n) { x.fillStyle = '#e8edf7'; x.beginPath(); x.arc(0, 0, R, 0, 7); x.fill(); x.restore(); return; }
  const a = 2 * Math.PI / n;
  for (let i = 0; i < n; i++) {
    x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, R, rot + i * a, rot + (i + 1) * a); x.closePath();
    x.fillStyle = COL[i % COL.length]; x.fill();
    if (n <= 30) {
      x.save(); x.rotate(rot + (i + .5) * a); x.fillStyle = '#fff';
      x.font = '600 ' + Math.max(22, Math.min(40, 520 / n)) + 'px "Bricolage Grotesque",sans-serif';
      x.textAlign = 'right'; x.textBaseline = 'middle'; x.fillText(pool[i].nome.split(' ')[0].slice(0, 14), R - 28, 0); x.restore();
    }
  }
  x.beginPath(); x.arc(0, 0, 34, 0, 7); x.fillStyle = '#fff'; x.fill(); x.restore();
}

function girar() {
  if (spinning || !pool.length) return; spinning = true; $('#gira').disabled = true;
  const n = pool.length, a = 2 * Math.PI / n, i = crypto.getRandomValues(new Uint32Array(1))[0] % n;
  const base = -Math.PI / 2 - (i + .5) * a, m = Math.ceil((rot + 10 * Math.PI - base) / (2 * Math.PI)), fim = base + 2 * Math.PI * m, ini = rot;
  const dur = matchMedia('(prefers-reduced-motion:reduce)').matches ? 1 : 5500, t0 = performance.now();
  (function f(t) {
    const p = Math.min(1, (t - t0) / dur); rot = ini + (fim - ini) * (1 - Math.pow(1 - p, 4)); desenhar();
    if (p < 1) requestAnimationFrame(f); else { spinning = false; ganhador(pool[i]); }
  })(t0);
}

function ganhador(r) {
  const d = $('#dlg');
  d.innerHTML = `<p>A pessoa sorteada é</p><p class="nome">${esc(r.nome)}</p>
  <button class="btn" id="ok">Confirmar ganhador(a)</button><br><button class="btn sec" id="de">Sortear de novo</button>`;
  d.showModal();
  $('#de').onclick = () => { d.close(); filtrar(); };
  $('#ok').onclick = async () => {
    $('#ok'].disabled = true;
    const x = await api({ acao: 'ganhou', chave: S.chave, slug: S.slug, linha: r.linha });
    if (!x.ok) { $('#ok'].disabled = false; return alert('Não foi possível salvar. Tente de novo.'); }
    r.ganhou = 'sim'; d.close(); vRol();
  };
}
</script>
</body>
</html>
